name: Godot CI/CD

on:
  push:
    branches: [ develop, release/** ]
  pull_request:
    branches: [ develop ]

env:
  GODOT_VERSION: 4.3
  EXPORT_NAME: autobot-murderhell

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Godot
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Install GdUnit4
        run: |
          # Download GdUnit4 from the Asset Library
          mkdir -p addons
          git clone --depth 1 https://github.com/MikeSchulze/gdUnit4.git addons/gdUnit4 || true

      - name: Run Unit Tests
        run: |
          godot --headless --script addons/gdUnit4/bin/GdUnitCmdTool.gd --add test --continue || echo "Tests failed or GdUnit4 not properly installed"

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-results
          path: |
            reports/
            *.xml

  build-linux:
    name: Build Linux
    needs: test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/heads/release/')
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Linux Build
        run: |
          mkdir -v -p build/linux
          godot --headless --verbose --export-release "Linux/X11" build/linux/$EXPORT_NAME.x86_64

      - name: Upload Linux Build
        uses: actions/upload-artifact@v3
        with:
          name: linux
          path: build/linux

  build-windows:
    name: Build Windows
    needs: test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/heads/release/')
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Windows Build
        run: |
          mkdir -v -p build/windows
          godot --headless --verbose --export-release "Windows Desktop" build/windows/$EXPORT_NAME.exe

      - name: Upload Windows Build
        uses: actions/upload-artifact@v3
        with:
          name: windows
          path: build/windows

  build-web:
    name: Build Web
    needs: test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/heads/release/')
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Web Build
        run: |
          mkdir -v -p build/web
          godot --headless --verbose --export-release "Web" build/web/index.html

      - name: Upload Web Build
        uses: actions/upload-artifact@v3
        with:
          name: web
          path: build/web

      - name: Deploy to GitHub Pages
        if: startsWith(github.ref, 'refs/heads/release/')
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy to GitHub Pages'
